[package]
name = "proxy-signal"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.99"

[dependencies]
anyhow = "1"
nix = { version = "0.29", features = ["signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "process", "signal"] }
