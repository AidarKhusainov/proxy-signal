version: 1
interval_seconds: 300
timeout_seconds: 20
parallelism: 2
state_file: /data/state.json
endpoints:
  - id: ipify
    url: https://api.ipify.org
sources:
  - id: test-profile
    kind: file
    path: /profiles/example.json
    # Optional: constrain the expected public exit addresses.
    expected_exit_ips: []
    # Optional stage-3 scenario. Use only with a test profile and a known test domain.
    # scenarios:
    #   - id: direct-check
    #     url: https://example.org/
    #     route: direct
    #     outbound_tag: direct
    #     dns:
    #       server: "UDP:1.1.1.1:53"
    #       expected_ips: [93.184.215.14]
    # Optional balancing scenario; verify exact outbound tags from this profile.
    # The first routing rule for example.com should use balancerTag: latency.
    # balancers:
    #   - id: latency
    #     url: https://example.com/
    #     balancer_tag: latency
    #     strategy: leastPing
    #     candidates: [node-a, node-b]
    #     fallback_tag: direct
    # Optional cascade; selected outbound first, then successive dialer proxies.
    # Modern Xray uses streamSettings.sockopt.dialerProxy.
    # cascades:
    #   - id: multi-hop
    #     url: https://example.net/
    #     outbounds: [entry, relay, exit]  # exact outbound tags in dialer order
    # Controlled loopback SOCKS failover (synthetic lab profile ONLY).
    # No remote node is ever impaired. The primary SOCKS outbound must
    # reference 127.0.0.1:20001 and the balancer must use leastPing.
    # failover:
    #   - id: lab-switch
    #     url: https://example.com/
    #     balancer_tag: pool
    #     primary_tag: primary
    #     alternatives: [backup]
    #     fallback_tag: backup
    #     control_port: 20001
    #     restore_primary: true
    # Optional CDN/XHTTP probe; endpoint status is independent from HTTPS
    # through the configured VPN outbound, and CDN route stays UNKNOWN.
    # cdn:
    #   - id: edge
    #     endpoint_url: https://cdn.example.org/health
    #     expected_http_status: 404
    #     url: https://example.com/
    #     outbound_tag: vpn-xhttp
  # - id: authenticated-profile
  #   kind: https
  #   url: https://subscription.example.org/config.json
  #   headers:
  #     Authorization: /run/secrets/subscription-auth
  #     X-HWID: /run/secrets/hwid
  #   expected_exit_ips: []
# Telegram is optional. Uncomment to send state-change notifications.
# telegram:
#   bot_token_file: /run/secrets/telegram-token
#   chat_id: "123456789"
