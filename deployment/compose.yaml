name: proxy-signal-parallel
services:
  proxy-signal:
    image: ${PROXYSIGNAL_IMAGE:?Provide immutable GHCR image @sha256}
    pull_policy: never
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700
    volumes:
      - ./private/config.yaml:/etc/proxy-signal/config.yaml:ro
      - ./private/secrets:/run/secrets:ro
      - proxy-signal-data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/state.json"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s
volumes:
  proxy-signal-data:
