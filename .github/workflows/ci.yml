name: Rust CI
on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proxy-signal-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Temporary one-time lockfile capture; removed after Cargo.lock is committed.
      - name: Resolve dependency lockfile
        run: |
          cargo generate-lockfile
          printf '\nPROXYSIGNAL_LOCK_BEGIN\n'
          base64 -w0 Cargo.lock
          printf '\nPROXYSIGNAL_LOCK_END\n'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
