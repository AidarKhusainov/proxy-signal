name: Rust CI
on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'config.example.yaml'
      - 'scripts/smoke-docker.sh'
      - '.github/workflows/ci.yml'
      - 'deployment/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proxy-signal-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Offline external watchdog regression tests
        run: python3 -m unittest discover -s deployment/tests -p 'test_*.py' -v
      - name: Isolated pinned-Gatus HTTP/DNS/TLS, incident and durable webhook regression
        run: GATUS_LIVE_FIXTURES=1 python3 -m unittest discover -s deployment/tests -p 'test_gatus_*live.py' -v
      - name: Isolated pinned-Gatus panel status and silence regression (#160)
        run: GATUS_LIVE_FIXTURES=1 python3 deployment/tests/test_panel_observer_live.py -v
      - name: Validate parallel Compose syntax
        run: |
          PROXYSIGNAL_IMAGE="ghcr.io/example/proxy-signal@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" docker compose -f deployment/compose.yaml config --quiet
      - name: Validate localhost-only Kuma observer Compose
        run: |
          KUMA_IMAGE="docker.io/louislam/uptime-kuma@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" PYTHON_IMAGE="docker.io/library/python@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" KUMA_MONITOR_NAME="ProxySignal watchdog" docker compose -f deployment/kuma/compose.yaml config --quiet
      - name: Validate localhost-only Gatus observer Compose
        run: |
          GATUS_IMAGE="ghcr.io/twin/gatus@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" docker compose -f deployment/gatus/compose.yaml config --quiet
      - name: Validate opt-in pinned durable notifier Compose overlay
        run: |
          GATUS_IMAGE="ghcr.io/twin/gatus@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" GATUS_NOTIFIER_IMAGE="docker.io/library/python@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" GATUS_OBSERVER_ROLE="fin1" GATUS_ALERT_MODE="test" docker compose -f deployment/gatus/compose.yaml -f deployment/gatus/durable-compose.yaml config --quiet
      # Release/acceptance check only; avoid a Docker rebuild on every PR push.
      - name: Docker Compose and Xray smoke
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p profiles secrets
          cp config.example.yaml config.yaml
          docker compose config --quiet
          sh scripts/smoke-docker.sh
